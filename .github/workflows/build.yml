name: Build & Release APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Set up Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            --channel=0 2>&1 | grep -v "^\[=" || true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate localisations
        run: flutter gen-l10n

      - name: Build Debug APK
        run: flutter build apk --debug 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}

      - name: Show errors on failure
        if: failure()
        run: |
          echo "=== BUILD ERRORS ==="
          grep -iE "error:|^e: " /tmp/build.log | head -60 || true
          echo "=== LAST 100 LINES ==="
          tail -100 /tmp/build.log

      - name: Rename APK
        if: success()
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          NEW=VirtualSIM-debug-${{ github.run_number }}.apk
          cp $APK $NEW
          echo "APK_PATH=$(pwd)/$NEW" >> $GITHUB_ENV

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VirtualSIM-APK-${{ github.run_number }}
          path: VirtualSIM-debug-${{ github.run_number }}.apk
          retention-days: 90

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Virtual SIM — Build ${{ github.run_number }}"
          body: |
            ## Virtual SIM APK — Build ${{ github.run_number }}

            ### התקנה:
            1. הורד את הקובץ `VirtualSIM-debug-${{ github.run_number }}.apk`
            2. פתח בטלפון → אשר התקנה ממקורות לא ידועים

            ### שימוש:
            - **שאיבה**: חבר WiFi → לחץ "התחל שאיבה" → המתן עד שיסתיים
            - **Virtual SIM**: לחץ "הפעל Virtual SIM" → גלוש ממטמון

            ### מה כלול:
            - Flutter UI — עיצוב כהה מקצועי, תמיכת כל שפות המכשיר
            - סוכן AI עם Claude Haiku (דורש API Key בהגדרות)
            - VPN proxy עם MITM HTTPS + TUN packet processing
            - מטמון חכם 500MB+, DNS offline

            > **commit:** ${{ github.sha }}
          files: VirtualSIM-debug-${{ github.run_number }}.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
