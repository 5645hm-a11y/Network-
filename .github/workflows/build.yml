name: Build APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  # מאפשר הרצה ידנית דרך GitHub UI
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. שכפול הקוד
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. הגדרת Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. הגדרת Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. הרשאות הרצה ל-gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Cache של Gradle dependencies (מאיץ builds עתידיים)
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 6. בניית APK בגרסת debug
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"

      # 7. העלאת ה-APK כ-Artifact להורדה
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NetworkAbsorb-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 8. הצגת מידע על ה-APK שנבנה
      - name: APK Info
        run: |
          echo "✅ APK built successfully!"
          ls -lh app/build/outputs/apk/debug/
          echo "Download the APK from the Actions tab → Artifacts section"
