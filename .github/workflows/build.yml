name: Build & Release APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            --channel=0 2>&1 | grep -v "^\[=" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}

      - name: Show errors on failure
        if: failure()
        run: |
          echo "=== BUILD ERRORS ==="
          grep -n "error:\|^e: " /tmp/build.log | head -50 || true
          echo "=== LAST 100 LINES ==="
          tail -100 /tmp/build.log

      - name: Rename APK
        if: success()
        run: |
          cd app/build/outputs/apk/debug/
          mv *.apk VirtualSIM-debug-${{ github.run_number }}.apk
          echo "APK_PATH=$(pwd)/VirtualSIM-debug-${{ github.run_number }}.apk" >> $GITHUB_ENV
          ls -lh

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VirtualSIM-APK-${{ github.run_number }}
          path: app/build/outputs/apk/debug/VirtualSIM-debug-${{ github.run_number }}.apk
          retention-days: 90

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Virtual SIM — Build ${{ github.run_number }}"
          body: |
            ## Virtual SIM APK — Build ${{ github.run_number }}

            ### התקנה:
            1. הורד את הקובץ `VirtualSIM-debug-${{ github.run_number }}.apk`
            2. פתח את הקובץ בטלפון (אפשר `sideload` מ-Termux: `adb install *.apk`)
            3. אשר התקנה ממקורות לא ידועים

            ### שימוש:
            - **שאיבה**: חבר WiFi → לחץ "שאב אינטרנט מה-WiFi" → המתן עד שיסתיים
            - **Virtual SIM**: כבה WiFi/סלולרי → לחץ "הפעל Virtual SIM" → גלוש רגיל מהמטמון

            ### מה עובד:
            - כל האפליקציות שמשתמשות בחיבור רגיל (גוגל מפות, חדשות, ויקיפדיה...)
            - DNS offline — הטלפון מוצא כתובות גם בלי אינטרנט
            - HTTPS מלא עם זיהוי אוטומטי של Certificate Pinning
            - TCP relay לאפליקציות שעוקפות את ה-Proxy

            > **commit:** ${{ github.sha }}
          files: app/build/outputs/apk/debug/VirtualSIM-debug-${{ github.run_number }}.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
